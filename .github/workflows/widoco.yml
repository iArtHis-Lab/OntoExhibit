name: Generate Widoco Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  widoco-gen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Widoco
        run: wget https://github.com/dgarijo/Widoco/releases/download/v1.4.25/widoco-1.4.25-jar-with-dependencies_JDK-17.jar -O widoco.jar

      - name: Run Widoco
        run: |
          java -jar widoco.jar \
            -ontFile resources/ontoExhibit.rdf \
            -outFolder docs \
            -confFile resources/widoco.properties \
            -rewriteAll \
            -webVowl \
            -oops \
            -lang en-es \
            -htaccess \
            -uniteSections \
            -noPlaceHolderText \
            -includeAnnotationProperties

      - name: Post-process Widoco Output
        run: |
          find docs -name "*.html" -exec sed -i -E 's/width="50\/?\/*"/width="200"/g' {} +
          find docs -name "*.html" -exec sed -i 's|</head>|<style>.modeling-note-title { background-color: #f8f9fa; border-left: 4px solid #17a2b8; padding: 5px 10px; margin-top: 15px; font-weight: bold; color: #17a2b8; display: inline-block; border-radius: 4px 4px 0 0; } .modeling-note-body { background-color: #f8f9fa; border-left: 4px solid #17a2b8; padding: 10px 15px; margin-bottom: 15px; font-style: italic; color: #495057; border-radius: 0 4px 4px 4px; }</style></head>|g' {} +
          find docs -name "*.html" -exec sed -i 's|</body>|<script>document.addEventListener("DOMContentLoaded", function() { document.querySelectorAll("dt").forEach(function(dt) { var t = dt.textContent.trim().toLowerCase(); if (t === "nota de modelado" || t === "modeling note") { dt.classList.add("modeling-note-title"); var dd = dt.nextElementSibling; if (dd && dd.tagName === "DD") { dd.classList.add("modeling-note-body"); } } }); });</script></body>|g' {} +

      - name: Deploy Premium Landing Page
        run: |
          cp resources/logo_ontoexhibit.png docs/logo_ontoexhibit.png
          cp resources/landing/index.html docs/index.html

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "chore: update widoco documentation [skip ci]" || echo "No changes to commit"
          git push
